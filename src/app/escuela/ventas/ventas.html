
<div class="max-w-6xl mx-auto p-6 bg-white rounded-lg shadow">

  <div class="p-6 mb-8 text-blue-900 bg-blue-100 rounded-lg">
    <h2 class="text-2xl font-bold">Total de ventas</h2>

    <p class="mt-3 text-4xl font-bold">
      {{ totalVentas | currency:'MXN' }}
    </p>
  </div>

  <div *ngIf="indiceEditar != -1" class="p-6 mb-8 bg-gray-50 rounded-lg">

    <h2 class="mb-4 text-xl font-bold text-gray-900">
      Editar venta
    </h2>

    <form [formGroup]="formulario">

      <div class="mb-5">
        <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
          Comprador
        </label>

        <input type="text" id="nombre" formControlName="nombre"
          class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <div class="mb-5">
        <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">
          Cantidad de boletos
        </label>

        <input type="number" id="boletos" formControlName="boletos"
          class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <div class="mb-5">
        <label for="total" class="block mb-2 text-sm font-medium text-gray-900">
          Total pagado
        </label>

        <input type="number" id="total" formControlName="total"
          class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5">
      </div>

      <button type="button" (click)="guardarCambios()"
        class="px-5 py-2.5 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800">
        Guardar cambios
      </button>

    </form>

  </div>

  <h2 class="mb-4 text-2xl font-bold text-gray-900">
    Registro de ventas
  </h2>

  <div class="relative overflow-x-auto shadow-md sm:rounded-lg">

    <table class="w-full text-sm text-left text-gray-500">

      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th class="px-6 py-3">Comprador</th>
          <th class="px-6 py-3">Boletos</th>
          <th class="px-6 py-3">Total pagado</th>
          <th class="px-6 py-3">Acciones</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let venta of ventasGuardadas; let i = index"
          class="bg-white border-b border-gray-200 hover:bg-gray-50">

          <td class="px-6 py-4">{{ venta.nombre }}</td>

          <td class="px-6 py-4">{{ venta.boletos }}</td>

          <td class="px-6 py-4">
            {{ venta.total | currency:'MXN' }}
          </td>

          <td class="px-6 py-4">
            <div class="flex gap-2">

              <button type="button" (click)="editarVenta(i)"
                class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700">
                Editar
              </button>

              <button type="button" (click)="eliminarVenta(i)"
                class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700">
                Eliminar
              </button>

            </div>
          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <div *ngIf="ventasGuardadas.length == 0"
    class="p-4 mt-4 text-sm text-gray-800 bg-gray-100 rounded-lg">
    No hay ventas registradas.
  </div>

</div>
